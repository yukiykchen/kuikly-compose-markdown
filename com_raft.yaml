name: markdown-compose-renderer                     # 组件英文名，必填，纯英文不允许带空格
displayName: "Markdown渲染器"              # 组件展示名，选填，填写后替代英文名进行展示
version: 1.0.2                            # 组件版本，必填
apiVersion: npm/v1
platform: kuikly
summary: "KMP markdown渲染器"                              # 组件介绍摘要，必填，用于市场首页展示
description: "基于Kuikly Compose实现的markdown跨平台解析器"   # 组件详细介绍，必填，用于组件详情页展示
team: "腾讯新闻"                                  # 团队名称，必填，用于市场团队展示，由上架业务团队自行定义即可
kotlin: 1.9.22                                   # 组件的kotlin版本环境
kuiklyType: "KMP"               # 官方KMP组件或者是Kuikly组件,kuikly组件包含自定义module和自定义view两种类别
kuiklyTarget:                   # 以下字段标识组件可运行的平台
  - android                     # 组件是否支持Android端运行
  - iOS                         # 组件是否支持iOS端运行
  - ohosNative                  # 支持native产物在鸿蒙上运行
owner:                          # 负责人
  - fitzwu
