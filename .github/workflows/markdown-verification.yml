name: Markdown Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # GitHub macOS runners already ship the Android SDK. The setup action's
      # default legacy "tools" package is removed from current SDK repositories.
      - name: Configure Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$manager" ]; then
            yes | "$manager" --licenses >/dev/null || true
            "$manager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --global yarn@1.22.22
      - run: bash scripts/production-gates.sh
      - run: bash scripts/js-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-verification
          path: |
            markdown/build/reports
            markdown/build/test-results
            markdown/build/outputs/aar/markdown-release.aar
